dataset_size: small

kmer_size: 3

gene_lengths:
  min: 50
  max: 10000

train_test_split:
  test_size: 0.2
  validation_size: 0.2

xgb_params:
  n_estimators: 300
  max_depth: 10
  learning_rate: 0.1
  subsample: 1.0
  colsample_bytree: 1.0
  random_state: 42
  eval_metric: logloss
  early_stopping_rounds: 10

percentage_of_random_non_genes: 0.5

entrez_search_queries:
  genes: "Bacteria[Organism] AND gene[Title]"
    # - "Bacteria[Organism] AND gene[Title] AND srcdb_refseq[PROP]"
    # The query above is used to get genes from RefSeq, which is a 
    # curated database of genomes and genes.
    # But it does not have enough genes for the training set.
  genomes: "Bacteria[Organism] AND complete genome[Title]"
    # - "Bacteria[Organism] AND complete genome[Title] AND srcdb_refseq[PROP]"
    # The query above is used to get genes from RefSeq, which is a 
    # curated database of genomes and genes.
    # But it does not have enough genes for the training set.

taxonomic_diversity:
  genomes:
    enforced: true
    normalized_h_min: 0.8  
  genes:
    enforced: false
    normalized_h_min: 0.0
  # Minimum allowed normalized Shannon diversity index (H') for the set of organisms.
  # Normalized H (H') ranges from 0 to 1, where 1 means maximum diversity (equal representation of all organisms).
  # A value of 0.8 enforces high diversity by requiring that the organism distribution be fairly even and varied.
