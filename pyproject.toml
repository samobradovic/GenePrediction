[project]
name = "introproject"
version = "0.1.0"
description = "A BioPython-based project for genome and protein sequence analysis."
authors = []
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    # Core functionality
    "biopython>=1.81",
    "argparse",

    # Machine learning and transformations
    "torch>=2.6.0,<3.0.0",
    "transformers>=4.49.0,<5.0.0",
    "einops>=0.8.1,<0.9.0",

    # Data processing and visualization
    "pandas>=2.2.3,<3.0.0",
    "matplotlib>=3.10.1,<4.0.0",
    "scikit-learn>=1.6.1,<2.0.0",
    "xgboost>=2.1.4,<3.0.0",

    # Utilities and workflow
    "dill>=0.3.9,<0.4.0",
    "dvc>=3.59.1,<4.0.0",
    "tqdm>=4.67.1,<5.0.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
ruff = "^0.9.10"

# Ruff configuration
[tool.ruff]
line-length = 88
target-version = "py313"
fix = true

[tool.ruff.lint]
select = [
    "I",  # Import sorting
    "E",  # Error checks
    "F",  # Pyflakes checks
    "W"   # Warnings
]

[tool.ruff.format]
quote-style = "double"
