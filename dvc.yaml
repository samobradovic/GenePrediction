stages:
  # TODO add validate params stage

  compile_c_modules:
    # Compile C modules for faster execution
    cmd: poetry run python src/c_lang/compile_c_modules.py build_ext
    deps:
      - src/c_lang/compile_c_modules.py
      - src/c_lang/kmers.c
    params:
      - constants.yaml:
        - paths.c_lang.src_dir
        - paths.c_lang.build_dir
    outs:
      - src/c_lang/build

  # ======================== Data Loading ========================
  fetch_ids:
    cmd: poetry run python src/data_loading/fetch_ids.py
    deps:
      - src/data_loading/fetch_ids.py
    params:
      - dataset_size
      - taxonomic_diversity
      - entrez_search_queries
      - constants.yaml:
        - paths.raw.genome_ids_file
        - paths.raw.gene_ids_file
        - dataset_sizes
        - entrez_email
    outs:
      - data/raw/genome_ids
      - data/raw/gene_ids


  download_genomes:
    # Download raw genome and gene data with Entrez
    cmd: poetry run python src/data_loading/entrez_downloader.py
    deps:
      - src/data_loading/entrez_downloader.py
      - src/helpers/filesystem_helper.py
    params:
      - dataset_size
      - constants.yaml:
        - retry_entrez_request
        - file_format
        - max_sizes_gb
        - batch_sizes
        - paths.raw.genomes_dir
        - paths.raw.genes_dir
        - paths.raw.genome_ids_file
        - paths.raw.gene_ids_file
        - dataset_sizes
        - entrez_email
    outs:
      - data/raw/genomes
      - data/raw/genes

  # ======================== Data Loading End ========================

  csv_conversion:
    # Convert FASTA files to CSV format
    cmd: poetry run python src/data_preprocessing/fasta_to_csv_converter.py
    deps:
      - src/data_preprocessing/fasta_to_csv_converter.py
      - data/raw/genes
      - src/helpers/filesystem_helper.py
      - src/helpers/csv_helper.py
    params:
      - constants.yaml:
        - paths.raw.genes_dir
        - paths.raw.genes_csv
    outs:
      - data/raw/genes.csv

  non_gene_generation:
    # Generate non-gene sequences
    cmd: poetry run python src/data_preprocessing/non_gene_generator.py
    deps:
      - src/data_preprocessing/non_gene_generator.py
      - data/raw/genes.csv
      - data/raw/genomes
      - data/raw/genes
    params:
      - percentage_of_random_non_genes
      - constants.yaml:
        - paths.raw.genes_csv
        - paths.raw.genomes_dir
        - paths.raw.combined_csv
    outs:
      - data/raw/combined.csv

  data_cleanup:
    # Clean the combined CSV file by removing duplicates and long/short sequences
    cmd: poetry run python src/data_preprocessing/data_cleanup.py
    deps:
      - src/data_preprocessing/data_cleanup.py
      - data/raw/combined.csv
    params:
      - constants.yaml:
        - paths.raw.combined_csv
        - paths.raw.combined_csv_clean
      - gene_lengths
    outs:
      - data/raw/combined_clean.csv

  train_test_split:
    # Split the combined CSV file into training, testing, and validation csvs
    cmd: poetry run python src/data_preprocessing/train_test_splitter.py
    deps:
      - src/data_preprocessing/train_test_splitter.py
      - data/raw/combined_clean.csv
    params:
      - constants.yaml:
        - paths.raw.combined_csv_clean
        - paths.processed.training_csv
        - paths.processed.testing_csv
        - paths.processed.validation_csv
      - train_test_split
    outs:
      - data/processed/training.csv
      - data/processed/testing.csv
      - data/processed/validation.csv

  vectorization:
    # Vectorize the training, testing, and validation data using CountVectorizer
    cmd: poetry run python src/data_preprocessing/vectorizer.py
    deps:
      - src/c_lang/build 
      - src/data_preprocessing/vectorizer.py
      - data/processed/training.csv
      - data/processed/testing.csv
      - data/processed/validation.csv
    params:
      - kmer_size
      - constants.yaml:
        - paths.processed.training_csv
        - paths.processed.testing_csv
        - paths.processed.validation_csv
        - paths.processed.training_vectorized
        - paths.processed.testing_vectorized
        - paths.processed.validation_vectorized
        - paths.models.vectorizer
    outs:
      - data/models/count_vectorizer.pkl
      - data/processed/training_vectorized.pkl
      - data/processed/testing_vectorized.pkl
      - data/processed/validation_vectorized.pkl

  xgb_training:
    # Train the XGBoost model using the training data
    cmd: poetry run python src/model_training/xgboost_gene_predictor.py
    deps:
      - src/model_training/xgboost_gene_predictor.py
      - data/processed/training_vectorized.pkl
      - data/processed/training.csv
      - data/processed/validation_vectorized.pkl
      - data/processed/validation.csv
    params:
      - xgb_params
      - constants.yaml:
        - paths.processed.training_vectorized
        - paths.processed.validation_vectorized
        - paths.processed.training_csv
        - paths.processed.validation_csv
        - paths.models.xgb_model
    outs:
      - data/models/xgb_model.pkl

  evaluation:
    # Evaluate the trained model using the testing data
    cmd: poetry run python src/evaluation/evaluation.py
    deps:
      - src/evaluation/evaluation.py
      - data/models/xgb_model.pkl
      - data/models/count_vectorizer.pkl
      - data/processed/testing_vectorized.pkl
      - data/processed/testing.csv
    params:
      - constants.yaml:
        - paths.models.xgb_model
        - paths.processed.testing_vectorized
        - paths.processed.testing_csv
        - paths.results.classification_report
        - paths.results.confusion_matrix
        - paths.results.roc_curve
        - paths.results.precision_recall_curve
        - paths.results.accuracy
    plots:
      - data/results/roc_curve.png
      - data/results/confusion_matrix.png
      - data/results/precision_recall_curve.png
      - data/results/classification_report.txt
      - data/results/accuracy.txt