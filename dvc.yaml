stages:
  download_genomes:
    cmd: python src/data_loading/genome_fetcher.py
    deps:
      - src/data_loading/genome_fetcher.py
    outs:
      - data/raw/genomes

  download_genes:
    cmd: python src/data_loading/gene_fetcher.py
    deps:
      - src/data_loading/gene_fetcher.py
    outs:
      - data/raw/genes

  preprocess:
    cmd: python src/data_preprocessing/csv_converter.py
    deps:
      - src/data_preprocessing/csv_converter.py
      - data/raw/genomes
      - data/raw/genes
    outs:
      - data/processed/training.csv