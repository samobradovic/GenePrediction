stages:
  download_genomes:
    cmd: poetry run python src/data_loading/entrez_downloader.py --dataset_size ${dataset_size}
    deps:
      - src/data_loading/entrez_downloader.py
    params:
      - dataset_size
    outs:
      - data/raw/genomes
      - data/raw/genes

  csv_converter:
    cmd: poetry run python src/data_preprocessing/fasta_to_csv_converter.py
    deps:
      - src/data_preprocessing/fasta_to_csv_converter.py
      - data/raw/genomes
      - data/raw/genes
    outs:
      - data/raw/combined.csv

  train_test_split:
    cmd: poetry run python src/data_preprocessing/data_preprocessing.py
    deps:
      - src/data_preprocessing/data_preprocessing.py
      - data/raw/combined.csv
    outs:
      - data/processed/training.csv
      - data/processed/testing.csv
      - data/processed/validation.csv



