stages:
  download_genomes:
    # Download raw genome and gene data with Entrez
    cmd: poetry run python src/data_loading/entrez_downloader.py
    deps:
      - src/data_loading/entrez_downloader.py
      - src/helpers/filesystem_helper.py
    params:
      - dataset_size
      - constants.yaml:
        - retry_entrez_request
        - file_format
        - max_sizes_gb
        - batch_sizes
        - paths
        - dataset_sizes
        - entrez_email
    outs:
      - data/raw/genomes
      - data/raw/genes

  csv_converter:
    cmd: poetry run python src/data_preprocessing/fasta_to_csv_converter.py
    deps:
      - src/data_preprocessing/fasta_to_csv_converter.py
      - src/data_preprocessing/non_gene_generator.py
      - data/raw/genomes
      - data/raw/genes
    params:
      - constants.yaml:
    outs:
      - data/raw/combined.csv

  train_test_split:
    cmd: poetry run python src/data_preprocessing/train_test_splitter.py
    deps:
      - src/data_preprocessing/train_test_splitter.py
      - data/raw/combined.csv
    params:
      - constants.yaml:
    outs:
      - data/processed/training.csv
      - data/processed/testing.csv
      - data/processed/validation.csv

  vectorizer:
    cmd: poetry run python src/data_preprocessing/vectorizer.py
    deps:
      - src/data_preprocessing/vectorizer.py
      - data/processed/training.csv
      - data/processed/testing.csv
      - data/processed/validation.csv
    params:
      - kmer_size
      - constants.yaml:
    outs:
      - data/models/count_vectorizer.pkl
      - data/processed/training.npy
      - data/processed/testing.npy
      - data/processed/validation.npy

  xgb_train:
    cmd: poetry run python src/model_training/xgboost_gene_predictor.py
    deps:
      - src/model_training/xgboost_gene_predictor.py
      - data/processed/training.npy
      - data/processed/training.csv
      - data/processed/validation.npy
      - data/processed/validation.csv
    params:
      - constants.yaml:
    outs:
      - data/models/xgb_model.pkl

  evaluate:
    cmd: poetry run python src/evaluation/evaluation.py
    deps:
      - src/evaluation/evaluation.py
      - data/models/xgb_model.pkl
      - data/models/count_vectorizer.pkl
      - data/processed/testing.npy
      - data/processed/testing.csv
    params:
      - constants.yaml:
    plots:
      - results/receiver_operating_characteristic.png
      - results/confusion_matrix.png
      - results/precision_recall.png