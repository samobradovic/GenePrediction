stages:
  download_genomes:
    # Download raw genome and gene data with Entrez
    cmd: poetry run python src/data_loading/entrez_downloader.py
    deps:
      - src/data_loading/entrez_downloader.py
      - src/helpers/filesystem_helper.py
    params:
      - dataset_size
      - constants.yaml:
        - retry_entrez_request
        - file_format
        - max_sizes_gb
        - batch_sizes
        - paths
        - dataset_sizes
        - entrez_email
    outs:
      - data/raw/genomes
      - data/raw/genes

  csv_conversion:
    # Convert FASTA files to CSV format
    cmd: poetry run python src/data_preprocessing/fasta_to_csv_converter.py
    deps:
      - src/data_preprocessing/fasta_to_csv_converter.py
      - data/raw/genes
    params:
      - constants.yaml:
        - paths
    outs:
      - data/raw/genes.csv

  non_gene_generation:
    # Generate non-gene sequences
    cmd: poetry run python src/data_preprocessing/non_gene_generator.py
    deps:
      - src/data_preprocessing/non_gene_generator.py
      - data/raw/genes.csv
      - data/raw/genomes
      - data/raw/genes
    params:
      - constants.yaml:
        - paths
    outs:
      - data/raw/combined.csv

  data_cleanup:
    # Clean the combined CSV file by removing duplicates and long/short sequences
    cmd: poetry run python src/data_preprocessing/data_cleanup.py
    deps:
      - src/data_preprocessing/data_cleanup.py
      - data/raw/combined.csv
    params:
      - constants.yaml:
        - paths
      - gene_lengths:
        - min
        - max
    outs:
      - data/raw/combined_clean.csv

  train_test_split:
    # Split the combined CSV file into training, testing, and validation csvs
    cmd: poetry run python src/data_preprocessing/train_test_splitter.py
    deps:
      - src/data_preprocessing/train_test_splitter.py
      - data/raw/combined_clean.csv
    params:
      - constants.yaml:
        - paths
    outs:
      - data/processed/training.csv
      - data/processed/testing.csv
      - data/processed/validation.csv

  vectorization:
    # Vectorize the training, testing, and validation data using CountVectorizer
    cmd: poetry run python src/data_preprocessing/vectorizer.py
    deps:
      - src/data_preprocessing/vectorizer.py
      - data/processed/training.csv
      - data/processed/testing.csv
      - data/processed/validation.csv
    params:
      - kmer_size
      - constants.yaml:
        - paths
    outs:
      - data/models/count_vectorizer.pkl
      - data/processed/training.npy
      - data/processed/testing.npy
      - data/processed/validation.npy

  xgb_training:
    # Train the XGBoost model using the training data
    cmd: poetry run python src/model_training/xgboost_gene_predictor.py
    deps:
      - src/model_training/xgboost_gene_predictor.py
      - data/processed/training.npy
      - data/processed/training.csv
      - data/processed/validation.npy
      - data/processed/validation.csv
    params:
      - constants.yaml:
        - paths
    outs:
      - data/models/xgb_model.pkl

  evaluation:
    # Evaluate the trained model using the testing data
    cmd: poetry run python src/evaluation/evaluation.py
    deps:
      - src/evaluation/evaluation.py
      - data/models/xgb_model.pkl
      - data/models/count_vectorizer.pkl
      - data/processed/testing.npy
      - data/processed/testing.csv
    params:
      - constants.yaml:
        - paths
    plots:
      - results/receiver_operating_characteristic.png
      - results/confusion_matrix.png
      - results/precision_recall.png