
entrez_email: "Your.Name.Here@example.org"

file_format: "fasta"

paths:
  # Raw Data
  raw:
    genomes_dir: "data/raw/genomes"
    genes_dir: "data/raw/genes"
    genome_ids_file: "data/raw/genome_ids/entrez_genome_ids.txt"
    gene_ids_file: "data/raw/gene_ids/entrez_gene_ids.txt"
    genes_csv: "data/raw/genes.csv"
    combined_csv: "data/raw/combined.csv"
    combined_csv_clean: "data/raw/combined_clean.csv"

  # Processed Data
  processed:
    training_csv: "data/processed/training.csv"
    validation_csv: "data/processed/validation.csv"
    testing_csv: "data/processed/testing.csv"
    training_vectorized: "data/processed/training_vectorized.pkl"
    validation_vectorized: "data/processed/validation_vectorized.pkl"
    testing_vectorized: "data/processed/testing_vectorized.pkl"

  # Models
  models:
    xgb_model: "data/models/xgb_model.pkl"
    vectorizer: "data/models/count_vectorizer.pkl"

  # C Code
  c_lang:
    src_dir: "src/c_lang"
    build_dir: "src/c_lang/build"

  # Results
  results:
    classification_report: "data/results/classification_report.txt"
    confusion_matrix: "data/results/confusion_matrix.png"
    roc_curve: "data/results/roc_curve.png"
    precision_recall_curve: "data/results/precision_recall_curve.png"
    accuracy: "data/results/accuracy.txt"



batch_sizes:
  genes: 5000
  genomes: 5

retry_entrez_request:
  count: 15
  delay_seconds: 3

dataset_sizes:
  small:
    genes: 5000
    genomes: 10
  big:
    genes: 500000
    genomes: 50000
  max:
    genes: 1000000
    genomes: 100000

max_sizes_gb:
  genes: 150
  genomes: 150