batch_sizes:
  genes: 5000
  genomes: 5

retry_entrez_request:
  count: 15
  delay_seconds: 3

dataset_sizes:
  small:
    genes: 10000
    genomes: 10
  big:
    genes: 500000
    genomes: 50000
  max:
    genes: 1000000
    genomes: 100000

max_sizes_gb:
  genes: 150
  genomes: 150